<!DOCTYPE html>
<html>
<head>
  <title>Globoticket</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div class="container">
  <header>
    <h1><img src="img/globoticket-horizontal-white.svg"></h1>
    <a class="header-cart" href="basket.html" data-testid="cart-link" title="Go to basket">
      <img src="img/cart.svg" />
      <p><span id="ticket-count" data-testid="ticket-count">0</span> tickets</p>
    </a>
  </header>
  <section class="basket-section">
    <div class="table">
      <table>
        <thead>
        <tr>
          <th scope="col">Event name</th>
          <th scope="col">Date</th>
          <th scope="col">Price per ticket</th>
          <th scope="col">Quantity</th>
          <th scope="col">Total</th>
          <th scope="col"><span class="visually-hidden">Remove</span></th>
        </tr>
        </thead>
        <tbody>
        <tr id="basket-row">
          <td class="event-name" id="event-name" data-testid="event-name"></td>
          <td class="event-date" id="event-date" data-testid="event-date"></td>
          <td class="event-price" id="event-price" data-testid="event-price"></td>
          <td class="event-basket-quantity">
            <select name="quantity-dropdown" id="quantity-dropdown" data-testid="quantity-dropdown">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
            <button id="update-button" data-testid="update-button">Update</button>
          </td>
          <td class="event-total" id="event-total" data-testid="event-total"></td>
          <td class="event-remove">
            <button id="remove-button" data-testid="remove-button" aria-label="Remove from basket">Remove</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
  <section class="checkout" id="checkout-section">
    <div class="checkout-row">
      <label for="customer-name" class="checkout-label">Name on the ticket</label>
      <input type="text" id="customer-name" data-testid="customer-name" />
      <button id="checkout-button" data-testid="checkout-button">Checkout</button>
    </div>
  </section>
  <p id="checkout-message" class="checkout-message" data-testid="checkout-message" role="status"></p>
  <section>
    <p class="back-to-catalog"><img src="img/back-arrow.svg" /><a href="catalog.html">Back to event catalog</a></p>
  </section>

  <script>
    const EMPTY_BASKET_HTML = '<td colspan="6">No items in your basket.</td>';
    const orderDetails = JSON.parse(localStorage.getItem('orderDetails'));

    // Empty basket: no order in storage, the header counter at 0 and no checkout form
    function showEmptyBasket() {
      localStorage.removeItem('orderDetails');
      document.getElementById('ticket-count').innerText = '0';
      document.getElementById('basket-row').innerHTML = EMPTY_BASKET_HTML;
      document.getElementById('customer-name').value = '';
      document.getElementById('checkout-section').hidden = true;
    }

    if (orderDetails) {
      const pricePerTicket = parseFloat(orderDetails.eventPrice.replace('$', ''));
      const total = pricePerTicket * parseInt(orderDetails.eventQuantity);

      // Populate fields with event details
      document.getElementById('event-name').innerText = orderDetails.eventName;
      document.getElementById('event-date').innerText = orderDetails.eventDate;
      document.getElementById('event-price').innerText = orderDetails.eventPrice;
      document.getElementById('quantity-dropdown').value = orderDetails.eventQuantity;
      document.getElementById('event-total').innerText = `$${total.toFixed(2)}`;
      document.getElementById('ticket-count').innerText = orderDetails.eventQuantity;

      // Update the total price when quantity changes
      document.getElementById('update-button').addEventListener('click', function () {
        const newQuantity = document.getElementById('quantity-dropdown').value;
        const newTotal = pricePerTicket * newQuantity;

        document.getElementById('event-total').innerText = `$${newTotal.toFixed(2)}`;
        document.getElementById('ticket-count').innerText = newQuantity;

        // Update the quantity in localStorage
        orderDetails.eventQuantity = newQuantity;
        localStorage.setItem('orderDetails', JSON.stringify(orderDetails));
      });

      // Remove the item from the basket
      document.getElementById('remove-button').addEventListener('click', function () {
        document.getElementById('checkout-message').innerText = '';
        showEmptyBasket();
      });

      // Checkout: ask the ticket service for a PDF and download it, then empty the basket
      document.getElementById('checkout-button').addEventListener('click', async function () {
        const message = document.getElementById('checkout-message');
        const customerName = document.getElementById('customer-name').value.trim();
        if (!customerName) {
          message.innerText = 'Please enter the name on the ticket.';
          return;
        }
        message.innerText = '';
        const response = await fetch('/api/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            eventName: orderDetails.eventName,
            artist: orderDetails.eventArtist,
            eventDate: orderDetails.eventDate,
            quantity: parseInt(orderDetails.eventQuantity),
            unitPrice: pricePerTicket,
            customerName: customerName,
            purchasedAt: new Date().toISOString()
          })
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          message.innerText = 'Checkout failed: ' + (error.error || response.status);
          return;
        }
        const link = document.createElement('a');
        link.href = URL.createObjectURL(await response.blob());
        link.download = 'ticket.pdf';
        document.body.appendChild(link);
        link.click();
        link.remove();

        showEmptyBasket();
        message.innerText = 'Your ticket has been downloaded.';
      });
    } else {
      showEmptyBasket();
    }
  </script>
</div>
</body>
</html>
