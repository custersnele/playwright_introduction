server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's internal DNS; resolving at request time lets nginx start even if the ticket service is still booting.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $ticket_service http://ticket-service:8080;
        proxy_pass $ticket_service;
        proxy_set_header Host $host;
    }
}
