server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's internal DNS; resolving at request time lets nginx start even if the ticket service is still booting.
    resolver 127.0.0.11 valid=10s;

    # Browsers must revalidate pages, scripts and styles, so a redeploy is visible without a hard refresh.
    # (no-cache still allows a cheap 304 answer when nothing changed.)
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        add_header Cache-Control "no-store";
        set $ticket_service http://ticket-service:8080;
        proxy_pass $ticket_service;
        proxy_set_header Host $host;
    }
}
