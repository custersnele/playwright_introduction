# Run on the server from the repository root:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  globoticket:
    build: ../web
    container_name: globoticket-frontend
    restart: unless-stopped
    ports:
      # only reachable from the server itself; Caddy handles the public HTTPS traffic
      - "127.0.0.1:5001:80"
